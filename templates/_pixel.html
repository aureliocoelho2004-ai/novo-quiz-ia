{#- Pixel da Meta: visita + eventos guardados pelo servidor (cadastro, teste, compra) #}
{% if pixel_id %}
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '{{ pixel_id }}');
fbq('track', 'PageView');
{% for ev, params in pixel_eventos %}fbq('track', {{ ev | tojson }}, {{ params | tojson }});
{% endfor %}
// início de pagamento: botões de assinar (landing, página de assinatura e cadastro com plano)
document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-pixel-checkout]');
  if (el) fbq('track', 'InitiateCheckout', { value: +el.dataset.valor || 0, currency: 'BRL', content_name: el.dataset.pixelCheckout });
}, true);
</script>
<noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id={{ pixel_id }}&ev=PageView&noscript=1"></noscript>
{% endif %}
