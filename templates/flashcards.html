<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ titulo }}</title>
{#- Arquivo 100% autônomo: sem CDN, para funcionar offline depois de baixado. #}
<style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
           background: radial-gradient(1200px 600px at 50% -200px, #3a1d6e 0%, #160B29 60%) fixed, #160B29; color: #f1f5f9; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { width: 100%; max-width: 480px; background: #24133E; border: 1px solid #3D2766; border-radius: 16px; padding: 24px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: 1.5rem; color: #C1FC38; }
    .prof { margin: 0 0 16px; padding-bottom: 16px; border-bottom: 1px solid #3D2766; color: #B9A8D9; font-size: .875rem; }
    .contador { color: #B9A8D9; font-size: .875rem; margin-bottom: 8px; }
    .cena { perspective: 1000px; height: 260px; margin-bottom: 20px; cursor: pointer; }
    .giro { position: relative; width: 100%; height: 100%; transition: transform .6s; transform-style: preserve-3d; }
    .cena.virado .giro { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
            border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow-y: auto; }
    .frente { background: #2E1A4F; border: 2px solid #5B4388; font-size: 1.2rem; font-weight: 700; }
    .verso { background: #5920AB; transform: rotateY(180deg); font-size: 1.05rem; line-height: 1.45; }
    .dica { color: #9C88C4; font-size: .75rem; margin: -12px 0 16px; }
    .nav { display: flex; gap: 12px; }
    button { flex: 1; font: inherit; font-weight: 700; color: #fff; border: 0; border-radius: 12px; padding: 13px; cursor: pointer; background: #3D2766; }
    button.prim { background: #C1FC38; color: #24133E; }
    button:disabled { opacity: .4; cursor: default; }
    #btn-recomecar { display: block; width: 100%; margin-top: 12px; background: #5920AB; }
    .oculto { display: none !important; }
</style>
</head>
<body>
<main class="card">
    <h1>{{ titulo }}</h1>
    {% if professor %}<p class="prof">Prof. {{ professor }}</p>{% else %}<p class="prof">Quizify</p>{% endif %}
    <p class="contador">Cartão <span id="atual">1</span> de <span id="total"></span></p>
    <div id="cena" class="cena" role="button" tabindex="0" aria-label="Virar cartão">
        <div class="giro">
            <div class="face frente" id="frente"></div>
            <div class="face verso" id="verso"></div>
        </div>
    </div>
    <p class="dica">Toque no cartão para virar</p>
    <div class="nav">
        <button id="btn-ant">◀ Anterior</button>
        <button id="btn-prox" class="prim">Próximo ▶</button>
    </div>
    <button id="btn-recomecar" class="oculto">Recomeçar em outra ordem 🔀</button>
</main>
<script>
const CARTOES = {{ itens | tojson }};
const $ = (id) => document.getElementById(id);
let baralho = CARTOES.slice();   // 1ª passagem na ordem original
let indice = 0;

// Embaralha (Fisher–Yates) evitando, quando possível, repetir a ordem anterior.
function embaralhar(lista) {
    let copia = lista.slice();
    for (let tentativa = 0; tentativa < 5; tentativa++) {
        copia = lista.slice();
        for (let i = copia.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copia[i], copia[j]] = [copia[j], copia[i]];
        }
        if (copia.length < 2 || copia.some((item, i) => item !== lista[i])) break;
    }
    return copia;
}

function mostrar() {
    $('cena').classList.remove('virado');
    // espera o cartão desvirar para não revelar o verso do próximo
    setTimeout(() => {
        $('frente').textContent = baralho[indice].frente;
        $('verso').textContent = baralho[indice].verso;
    }, 150);
    $('atual').textContent = indice + 1;
    const ultimo = indice === baralho.length - 1;
    $('btn-ant').disabled = indice === 0;
    $('btn-prox').disabled = ultimo;
    $('btn-recomecar').classList.toggle('oculto', !ultimo);
}

function virar() { $('cena').classList.toggle('virado'); }
$('cena').onclick = virar;
$('cena').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); virar(); } };
$('btn-ant').onclick = () => { if (indice > 0) { indice--; mostrar(); } };
$('btn-prox').onclick = () => { if (indice < baralho.length - 1) { indice++; mostrar(); } };
// No último cartão: recomeça com os cartões numa ordem nova.
$('btn-recomecar').onclick = () => { baralho = embaralhar(baralho); indice = 0; mostrar(); };

$('total').textContent = CARTOES.length;
mostrar();
</script>
{% if divulgacao_js %}<script src="{{ divulgacao_js }}" async></script>{% endif %}
</body>
</html>
