{% extends "base.html" %}
{% block titulo %}Nova senha - Quizify{% endblock %}
{% block conteudo %}
<form method="post" class="space-y-4">
    <h2 class="text-xl font-bold text-center">🔑 Criar nova senha</h2>
    <p class="text-sm text-slate-400 text-center">Conta: <b class="text-slate-200">{{ email }}</b></p>
    <input type="email" name="usuario" value="{{ email }}" autocomplete="username" hidden>
    {% for campo, rotulo in [("nova", "Nova senha (mín. 8 caracteres)"), ("confirmar", "Confirmar nova senha")] %}
    <div>
        <label for="{{ campo }}" class="block text-sm font-medium mb-2 text-slate-300">{{ rotulo }}</label>
        <input id="{{ campo }}" name="{{ campo }}" type="password" required minlength="8" autocomplete="new-password"
               class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-lima">
    </div>
    {% endfor %}
    <button class="w-full bg-lima hover:bg-lima-claro text-tinta font-bold py-3 rounded-xl transition">Salvar e entrar</button>
</form>
{% endblock %}
