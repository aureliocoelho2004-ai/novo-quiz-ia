{#- Modo "vídeo" da landing /assine: o quiz real se joga sozinho, em loop.
    Acerta a 1ª, erra a 2ª, refaz só as erradas, acerta e comemora com troféu. -#}
<style>
    html, body { overflow: hidden; }
    #dedo { position: fixed; z-index: 20; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%;
            background: rgba(255, 255, 255, .55); border: 2px solid rgba(255, 255, 255, .9);
            box-shadow: 0 4px 14px rgba(0, 0, 0, .45); pointer-events: none; opacity: 0;
            transition: left .55s cubic-bezier(.4, 0, .2, 1), top .55s cubic-bezier(.4, 0, .2, 1), opacity .3s, transform .12s; }
    #dedo.toque { transform: scale(.72); }
    .palma { position: fixed; z-index: 15; font-size: 44px; pointer-events: none; animation: subir 2.6s ease-out forwards; }
    @keyframes subir { from { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; }
                       to { transform: translateY(-75vh) scale(1.15); opacity: 0; } }
</style>
<div id="dedo" aria-hidden="true"></div>
<script>
(() => {
    // focar o botão não pode rolar a página que contém o iframe
    const foco = HTMLElement.prototype.focus;
    HTMLElement.prototype.focus = function () { foco.call(this, { preventScroll: true }); };

    window.tocarCelebracao = () => {};   // o "vídeo" da landing é sempre sem som
    const dedo = document.getElementById('dedo');
    const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

    async function tocar(el) {
        const r = el.getBoundingClientRect();
        dedo.style.left = `${r.left + r.width * 0.62}px`;
        dedo.style.top = `${r.top + r.height * 0.55}px`;
        dedo.style.opacity = '1';
        await esperar(750);
        dedo.classList.add('toque');
        await esperar(130);
        dedo.style.opacity = '0';          // some no toque: a tela se reorganiza logo depois
        el.click();
        dedo.classList.remove('toque');
        await esperar(250);
    }

    const opcao = (certa) => {
        const q = rodada[indice];
        const i = certa ? q.correta : (q.correta + 1) % q.opcoes.length;
        return document.getElementById('opcoes').children[i];
    };

    function aplausos() {
        for (let i = 0; i < 14; i++) {
            setTimeout(() => {
                const p = Object.assign(document.createElement('div'), { className: 'palma', textContent: '👏' });
                p.style.left = `${8 + Math.random() * 78}%`;
                p.style.top = `${70 + Math.random() * 20}%`;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 2700);
            }, i * 180);
        }
    }

    async function rodar() {
        await esperar(1300);
        await tocar(opcao(true));                                  // 1ª pergunta: acerta
        await esperar(2300);
        await tocar(document.getElementById('btn-continuar'));
        await esperar(1100);
        await tocar(opcao(false));                                 // 2ª pergunta: erra
        await esperar(3000);
        await tocar(document.getElementById('btn-continuar'));
        await esperar(2600);                                       // resultado: 50%
        await tocar(document.getElementById('btn-erradas'));       // refaz só as erradas
        await esperar(1200);
        await tocar(opcao(true));                                  // agora acerta
        await esperar(2000);
        await tocar(document.getElementById('btn-continuar'));     // 100%: troféu e confetes
        aplausos();
        await esperar(6500);
        iniciar(QUESTOES, false);                                  // recomeça o "vídeo"
        rodar();
    }
    rodar();
})();
</script>
